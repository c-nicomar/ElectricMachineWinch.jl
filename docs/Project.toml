[deps]
Documenter = "e30172f5-a6a5-5a46-863b-614d45cd2de4"
ElectricMachineWinch = "0c7c3992-6b03-4dd7-9ce6-b78056c4dd77"
InductionMachineDrives = "d85c8359-f9b8-4611-8006-e67b7a824205"
WinchModels = "7dcfa46b-7979-4771-bbf4-0aee0da42e1f"

# docs/ is deliberately NOT a workspace member (see PlanDocu.md 2.1), and Pkg
# honours [sources] only in the active project and its workspace members. The
# unregistered InductionMachineDrives entry from the root Project.toml is
# therefore NOT inherited here and has to be repeated, even though make.jl
# never loads it directly.
[sources]
ElectricMachineWinch = {path = ".."}
InductionMachineDrives = {url = "https://github.com/c-nicomar/InductionMachineDrives.jl", rev = "main"}

[compat]
Documenter = "1"
julia = "1.12"
